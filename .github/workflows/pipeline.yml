name: Run Quant Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This grants permissions so the action can push JSON updates back
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Python Engine
        run: python engine/main.py

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "QuantBot"
          git config --global user.email "bot@local.host"
          git add data/assets.json
          git commit -m "Automated data pipeline update [skip ci]" || exit 0
          git push
