name: Daily Quantitative Engine

on:
  schedule:
    - cron: "0 1 * * 1-5" # Runs at 01:00 UTC Monday-Friday
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Engine & Update JSON
        run: python engine/main.py
        
      - name: Commit and Push Updates
        run: |
          git config --global user.name "QuantBot"
          git config --global user.email "bot@investment-intelligence.local"
          git add data/*.json
          git commit -m "Automated data pipeline update" || exit 0
          git push
