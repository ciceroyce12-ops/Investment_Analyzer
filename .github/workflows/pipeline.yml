name: Run Quant Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Python Engine
        run: python engine/main.py

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "QuantBot"
          git config --global user.email "bot@local.host"
          git add data/assets.json
          git commit -m "Automated data pipeline update [skip ci]" || exit 0
          git push
