name: Automated Portfolio Dashboard Builder

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to click a button to run it manually anytime

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script to generate fresh index.html
        run: python generate_dashboard.py

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v4

      - name: Upload generated site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the root directory containing the newly generated index.html

      - name: Deploy to GitHub Pages live site
        id: deployment
        uses: actions/deploy-pages@v4
