<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Intelligence Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Investment Intelligence Laboratory</h1>
        <p>Global Quantitative Ranking Engine & Multi-Asset Scenario Projections</p>
        
        <!-- Interactive User Controls -->
        <div class="control-panel">
            <div class="input-group">
                <label>Capital (IDR):</label>
                <input type="number" id="user-capital" value="10000000" step="1000000">
            </div>
            <div class="input-group">
                <label>Horizon (Years):</label>
                <input type="number" id="user-horizon" value="4" min="1" max="10">
            </div>
            <button onclick="updateDashboard()">Recalculate Projections</button>
        </div>

        <div id="ranking-section">
            <h2>🥇 Top 4 Quantitative Opportunities</h2>
            <div id="cards-container" class="cards-grid">Loading top picks...</div>
        </div>

        <div id="chart-section" style="margin-top: 40px;">
            <h2>📊 Global Asset Class Quantitative Scores</h2>
            <div id="plotly-bar-chart" style="width:100%; height:420px;"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
